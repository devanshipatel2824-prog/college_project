<h2>Student List</h2>
<button (click)="studService.addStudent()"    type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
ADD STDUENT
</button>

<app-table
  [details]="students"
  (edit)="editdata($event)"
  (delete)="studService.deleteStudent($event)">
</app-table>
<button (click)="gotohome()">Go to Dashboard</button> 


<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
 @if (studService.showForm) {
  <app-modal
    [model]="studService.model"
    [editIndex]="studService.editIndex"
    (save)="savestudent($event)">
  </app-modal>
}
  
    </div>
  </div>
</div>
