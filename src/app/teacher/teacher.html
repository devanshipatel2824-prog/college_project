<button (click)="teacherService.addTeacher()" type="button" class="btn btn-primary" data-bs-toggle="modal"
  data-bs-target="#exampleModal">
  ADD TEACHER
</button>
<br>
<app-table [details]="teacher" (edit)="editdata($event)" (delete)="teacherService.deleteteacher($event)"
  (view)="viewteacher($event)">
</app-table>

<button (click)="gotodashboard()">BACK TO DASHBOARD</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        @if(teacherService.showForm){
        <app-modal [model]="teacherService.model" [editIndex]="teacherService.editIndex"
          (save)="savesteacher($event)"></app-modal>
        }
      </div>
    </div>
  </div>
</div>
