<table border="1">
  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Address</th>
    <th>Gender</th>
    <th>Action</th>
  </tr>

  @for (detail of details; track $index) {
  <tr>
    <td>{{$index + 1}}</td>
    <td>{{ detail.name }}</td>
    <td>{{ detail.phoneno }}</td>
    <td>{{ detail.email }}</td>
    <td>{{ detail.address }}</td>
    <td>{{ detail.gender }}</td>

     <td>
       <button class="btn btn-primary" (click)="editStudent($index)" data-bs-toggle="modal" data-bs-target="#exampleModal">Edit</button>
      <button class="btn btn-danger" (click)="deleteStudent($index)">Delete</button>
    </td>
  </tr>
}
</table>
