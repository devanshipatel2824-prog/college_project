<table border="1">
  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Address</th>
    <th>Gender</th>
    <th>Action</th>
  </tr>

  @for (detail of details; track $index) {
  <tr>
    <td>{{$index + 1}}</td>
    <td>{{ detail.name }}</td>
    <td>{{ detail.phoneno }}</td>
    <td>{{ detail.email }}</td>
    <td>{{ detail.address }}</td>
    <td>{{ detail.gender }}</td>

    <td>
      <button (click)="edit.emit($index)">Edit</button>
      <button (click)="delete.emit($index)">Delete</button>
    </td>
  </tr>
  }
</table>
